# Runs the Nox test matrix through Pixi so CI uses the exact same entrypoints
# as local development (`pixi run nox --session ...`). Each nox session installs
# only what it needs, so CI, the local matrix, and the dev env never drift —
# and the e2e-only testcontainers -> pywin32 chain never reaches the unit jobs
# (it has no free-threaded Windows wheel).
# For more information see:
# https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions


name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly at 12am UTC
    - cron: '0 0 * * *'

# Declare default permissions as read only.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: [
          '3.10', '3.11', '3.12', '3.13', '3.13t', '3.14', '3.14t',
        ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: latest
          environments: default

      - name: Unit Tests
        run: pixi run nox --session "unit-${{ matrix.python }}"

      # e2e tests spin up a RabbitMQ testcontainer; docker is only available on
      # the ubuntu runners. The session also self-skips where docker is absent.
      - name: e2e Tests
        if: matrix.os == 'ubuntu-latest'
        run: pixi run nox --session "e2e-${{ matrix.python }}"

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # free-threading adds no type-system variation, so stable CPython only
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: latest
          environments: default

      - run: pixi run nox --session "typecheck-${{ matrix.python }}"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: latest
          environments: default

      - run: pixi run nox --session lint

  all-checks:
    # Branch protection on main requires the check named "All Tests Passed";
    # keep this display name so the required status keeps reporting.
    name: "All Tests Passed"
    if: always()
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.typecheck.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" ]]; then
            exit 1
          fi
